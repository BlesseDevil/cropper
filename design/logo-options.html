<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crimson logo in dark mode</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0a0c; color: #efe6da; font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  h1 { margin: 0; padding: 20px 20px 4px; font-size: 20px; }
  p.lead { margin: 0; padding: 0 20px 12px; color: #a69a90; font-size: 13px; }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 20px 28px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  figure { margin: 0; background: #15121a; border: 1px solid #2a2530; border-radius: 14px; overflow: hidden; }
  iframe { display: block; width: 100%; height: 440px; border: 0; background: #000; }
  figcaption { padding: 10px 14px 12px; border-top: 1px solid #2a2530; font-size: 13px; color: #a69a90; }
  figcaption b { color: #efe6da; }
</style>
</head>
<body>
<h1>Aura, dark mode, crimson logo</h1>
<p class="lead">Same backdrop; only the circle behind the logo changes.</p>
<main>
  <figure><iframe title="Dark circle" src="backdrop-frame.html?b=aura&t=dark&m=crimson"></iframe>
    <figcaption><b>1 &middot; Dark circle</b><br>Today's circle, with the crimson mark in place of the gold one.</figcaption></figure>
  <figure><iframe title="Cream circle" src="backdrop-frame.html?b=aura&t=dark&m=crimson&tile=cream"></iframe>
    <figcaption><b>2 &middot; Cream circle</b><br>A light disc so the crimson pops; the same logo on both themes.</figcaption></figure>
  <figure><iframe title="Dark circle with gold ring" src="backdrop-frame.html?b=aura&t=dark&m=crimson&tile=ring"></iframe>
    <figcaption><b>3 &middot; Dark + gold ring</b><br>Dark circle with a gold rim to lift the crimson off the glow.</figcaption></figure>
</main>
</body>
</html>
